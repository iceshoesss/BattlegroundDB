name: Build and Deploy BattlegroundDB

on:
  schedule:
    - cron: '0 19 * * *'  # 每天 UTC 19:00 (北京时间 03:00)
  workflow_dispatch:       # 手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Fetch card data from hsbg.cards
        run: dotnet run --project HsbgFetcher
      
      - name: Build BattlegroundDB.dll
        run: dotnet build BattlegroundDB/BattlegroundDB.csproj -c Release
      
      - name: Get version and check if new
        id: version
        shell: pwsh
        run: |
          $json = Get-Content BattlegroundDB/Data/bg_cards.json | ConvertFrom-Json
          $version = $json.meta.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Current version: $version"
          
          # 检查是否已存在该版本的 Release
          $release = gh release list --json tagName --jq ".[].tagName" | Select-String "v$version"
          if ($release) {
            echo "NEW_VERSION=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release v$version already exists, skipping deploy"
          } else {
            echo "NEW_VERSION=true" >> $env:GITHUB_OUTPUT
            Write-Host "New version detected: $version"
          }
      
      - name: Install Wrangler
        if: steps.version.outputs.NEW_VERSION == 'true'
        run: npm install -g wrangler
      
      - name: Upload DLL to Cloudflare KV
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          cd CloudflareBgdb
          wrangler kv key put --binding=BGDB_KV "dll/${{ steps.version.outputs.VERSION }}" --path="../BattlegroundDB/bin/Release/netstandard2.0/BattlegroundDB.dll" --remote
          
          # 设置更新时间
          $updatedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          wrangler kv key put --binding=BGDB_KV "updatedAt" "$updatedAt" --remote
          Write-Host "Updated at: $updatedAt"
      
      - name: Update version and deploy Worker
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tomlPath = "CloudflareBgdb/wrangler.toml"
          (Get-Content $tomlPath) -replace 'BGDB_VERSION = ".*"', "BGDB_VERSION = `"$version`"" | Set-Content $tomlPath
          cd CloudflareBgdb
          wrangler deploy
      
      - name: Create GitHub Release
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.VERSION }}" `
            --title "BattlegroundDB v${{ steps.version.outputs.VERSION }}" `
            --generate-notes `
            "BattlegroundDB/bin/Release/netstandard2.0/BattlegroundDB.dll#BattlegroundDB.dll"
