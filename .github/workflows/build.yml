name: Build and Deploy BattlegroundDB

on:
  schedule:
    - cron: '0 19 * * *'  # 每天 UTC 19:00 (北京时间 03:00)
  workflow_dispatch:       # 手动触发
    inputs:
      force:
        description: '强制部署（忽略版本检查）'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Fetch card data from hsbg.cards
        run: dotnet run --project HsbgFetcher

      - name: Build BattlegroundDB.dll
        run: dotnet build BattlegroundDB/BattlegroundDB.csproj -c Release

      - name: Generate web cards.json
        run: node scripts/build-web-json.mjs BattlegroundDB/Data/bg_cards.json web-cards.json

      - name: Get version and check if new
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = Get-Content BattlegroundDB/Data/bg_cards.json | ConvertFrom-Json
          $version = $json.meta.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Current version: $version"

          # 检查是否已存在该版本的 Release
          $force = "${{ github.event.inputs.force }}"
          $release = gh release list --json tagName --jq ".[].tagName" | Select-String "v$version"
          if ($release -and $force -ne "true") {
            echo "NEW_VERSION=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release v$version already exists, skipping deploy"
          } else {
            echo "NEW_VERSION=true" >> $env:GITHUB_OUTPUT
            Write-Host "New version detected: $version (force: $force)"
          }

      - name: Commit updated bg_cards.json
        if: steps.version.outputs.NEW_VERSION == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BattlegroundDB/Data/bg_cards.json
          git diff --staged --quiet || git commit -m "chore: update bg_cards.json to v${{ steps.version.outputs.VERSION }}"
          git push

      - name: Install Wrangler
        if: steps.version.outputs.NEW_VERSION == 'true'
        run: npm install -g wrangler

      - name: Upload DLL and JSON to Cloudflare KV
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $dllPath = "../BattlegroundDB/bin/Release/netstandard2.0/BattlegroundDB.dll"
          $jsonPath = "../BattlegroundDB/Data/bg_cards.json"
          cd CloudflareBgdb

          wrangler kv key put --binding=BGDB_KV "dll/$version" --path=$dllPath --remote
          Write-Host "Uploaded KV dll/$version"

          # 完整卡牌 JSON：按版本存一份，再写 latest 指针
          wrangler kv key put --binding=BGDB_KV "json/$version" --path=$jsonPath --remote
          wrangler kv key put --binding=BGDB_KV "json/latest" --path=$jsonPath --remote
          Write-Host "Uploaded KV json/$version and json/latest"

          # 设置更新时间
          $updatedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          wrangler kv key put --binding=BGDB_KV "updatedAt" "$updatedAt" --remote
          Write-Host "Updated at: $updatedAt"

      - name: Verify upload
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          cd CloudflareBgdb
          $version = "${{ steps.version.outputs.VERSION }}"

          foreach ($key in @("dll/$version", "json/$version", "json/latest")) {
            $result = wrangler kv key get --binding=BGDB_KV $key --remote 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ Upload verified: $key exists in KV"
            } else {
              Write-Host "✗ Upload failed: $key not found in KV"
              Write-Host $result
              exit 1
            }
          }

      - name: Update version and deploy Worker
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tomlPath = "CloudflareBgdb/wrangler.toml"
          (Get-Content $tomlPath) -replace 'BGDB_VERSION = ".*"', "BGDB_VERSION = `"$version`"" | Set-Content $tomlPath
          cd CloudflareBgdb
          wrangler deploy

      - name: Force deploy (if forced)
        if: github.event.inputs.force == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd CloudflareBgdb
          wrangler deploy

      - name: Create GitHub Release
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "v$version"
          $dll = "BattlegroundDB/bin/Release/netstandard2.0/BattlegroundDB.dll"
          $fullJson = "BattlegroundDB/Data/bg_cards.json"
          $webJson = "web-cards.json"

          $exists = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "BattlegroundDB $tag" `
              --generate-notes `
              "$dll#BattlegroundDB.dll" `
              "$fullJson#bg_cards.json" `
              "$webJson#cards.json"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "Created release $tag"
          } else {
            # 已存在（force 重跑）时覆盖同名资源，并补上缺失的 bg_cards.json
            gh release upload $tag $dll $fullJson $webJson --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "Updated assets on existing release $tag"
          }

      - name: Trigger web rebuild (HBT Cards)
        if: steps.version.outputs.NEW_VERSION == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/iceshoesss/HearthstoneBattlegroundTracker/dispatches `
            -H "Accept: application/vnd.github+json" `
            -f event_type=bgdb-updated
